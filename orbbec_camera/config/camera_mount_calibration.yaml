# Camera mount calibration for the robione vehicle (ozismak1).
#
# Gives the rigid transform from a vehicle frame to the camera's root frame
# (<camera_name>_link, which the driver publishes as the parent of all the
# optical frames).
#
# The source of truth is the camera_link entry of sensor_kit_calibration.yaml in
# ozismak1_sensor_kit_description: the vehicle URDF publishes that mount, so with
# the vehicle stack up nothing else may publish camera_link (it would get a second
# parent). This file only mirrors it for bench runs of
# dock_target_detector/launch/dock_detector.launch.xml with publish_camera_tf:=true,
# whose camera_* defaults are the base_link entry below. Keep all three in sync.
#
# The camera is at the rear of the vehicle, looking backwards (yaw 180 deg) and
# 32.79 deg down. Position measured by tape; roll and pitch from gravity, the camera
# accelerometer against the vehicle IMU with the vehicle standing still (2026-10-09).
#
# Angles are in radians (roll/pitch/yaw, applied ZYX).
base_link:
  camera_link:
    x: -0.25
    y: 0.0
    z: 0.91
    roll: -0.0057596  # -0.33 deg
    pitch: 0.5722874  # 32.79 deg nose down
    yaw: 3.1415927    # rear facing

# The same mount relative to the sensor kit, exactly as sensor_kit_calibration.yaml
# holds it. The kit frame is yawed ~182 deg with respect to base_link (its +x points
# towards the rear of the vehicle), which is why the yaw here is close to zero.
sensor_kit_base_link:
  camera_link:
    x: 2.302736
    y: 0.078306
    z: -1.461946
    roll: 0.005054
    pitch: 0.617784
    yaw: 0.034666
